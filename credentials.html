<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ILGC</title>
<link rel="icon" type="image/png" href="frontend/images/plaksha-symbol-teal.png">
<link rel="stylesheet" href="credentials.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="frontend/images/plaksha-symbol-teal.png" alt="Plaksha University" class="logo-img">
        <span>ILGC Project Showcase</span>
    </div>

    <a href="login.html" class="back-link">← Change Role</a>
</header>

<main class="page">

    <section class="credentials-card">

        <img src="frontend/images/plaksha-logo-teal.png" alt="Plaksha University" class="login-logo">

        <h1 id="roleTitle">Login</h1>

        <p id="roleDescription" class="subtitle">
            Enter your credentials to continue
        </p>

        <form onsubmit="loginUser(event)">

            <label for="userId">User ID</label>
            <input
                type="text"
                id="userId"
                placeholder="Enter your User ID"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="show-password"
                >
                    Show
                </button>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit" class="login-button">
                Login →
            </button>

        </form>

        <p class="demo-note">
            Demo login — any User ID and Password will work.
        </p>

    </section>

</main>

<footer>
    © 2026 ILGC · Plaksha University
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="credentials.js"></script>
</body>
</html>
